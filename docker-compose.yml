# Convenience wrapper — canonical file is deploy/docker-compose.yml (build: ..).
# From repo root: docker compose up --build
#
# HTTPS (optional): docker compose --profile https up -d

services:
  agent-vault:
    build: .
    ports:
      - "8200:8080"
    environment:
      PORT: "8080"
      AGENT_VAULT_DATA_DIR: /data
      AGENT_VAULT_UNSEAL_KEY: /data/unseal.key
      AGENT_VAULT_CADDY_CONFIG_DIR: /caddy-config
      AGENT_VAULT_INIT: ${AGENT_VAULT_INIT:-}
      AGENT_VAULT_PASSPHRASE: ${AGENT_VAULT_PASSPHRASE:-}
    volumes:
      - vault-data:/data
      - caddy-config:/caddy-config
    restart: unless-stopped

  caddy:
    profiles: ["https"]
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-config:/etc/caddy:ro
      - caddy-data:/data
    depends_on:
      - agent-vault
    restart: unless-stopped

volumes:
  vault-data:
  caddy-config:
  caddy-data:
