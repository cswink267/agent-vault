{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Agent Vault</title>
  <link rel="stylesheet" href="/ui/static/app.css">
</head>
<body class="page-login">
  <main class="container container-narrow">
    <h1>Agent Vault</h1>
    <p class="text-muted">Sign in with your vault passphrase.</p>
    <form id="login-form" class="form-card">
      <label for="passphrase">Passphrase</label>
      <input type="password" id="passphrase" name="passphrase" autocomplete="current-password" required>
      <p id="login-error" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </main>
  <script src="/ui/static/app.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function() { AV.initLoginPage(); });</script>
</body>
</html>
{{end}}
