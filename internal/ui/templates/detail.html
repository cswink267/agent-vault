{{define "detail"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Name}} - Agent Vault</title>
  {{template "head" .}}
  <link rel="stylesheet" href="/ui/static/app.css">
</head>
<body>
  {{template "nav" .}}
  <main class="container">
    <div class="page-header">
      <h1 id="detail-title">{{.Name}}</h1>
      <a href="/ui/" class="btn btn-secondary">Back</a>
    </div>
    <div id="detail-message" class="form-message" hidden></div>
    <div id="detail-content" class="form-card" data-secret-name="{{.Name}}">
      <p class="text-muted">Loading…</p>
    </div>
    <div class="button-row">
      <button type="button" id="btn-reveal" class="btn btn-secondary">Reveal</button>
      <button type="button" id="btn-copy" class="btn btn-secondary" disabled>Copy secret</button>
      <button type="button" id="btn-edit" class="btn btn-secondary">Edit</button>
      <button type="button" id="btn-delete" class="btn btn-danger">Delete</button>
    </div>
    <form id="edit-form" class="form-card" hidden>
      <h2>Edit secret</h2>
      <label for="edit-type">Type</label>
      <select id="edit-type" name="type" required>
        <option value="api_key">api_key</option>
        <option value="login">login</option>
        <option value="ssh_key">ssh_key</option>
        <option value="token">token</option>
        <option value="note">note</option>
      </select>
      <label for="edit-secret">Secret</label>
      <input type="password" id="edit-secret" name="secret">
      <label for="edit-username">Username</label>
      <input type="text" id="edit-username" name="username">
      <label for="edit-url">URL</label>
      <input type="url" id="edit-url" name="url">
      <label for="edit-tags">Tags (comma-separated)</label>
      <input type="text" id="edit-tags" name="tags">
      <label for="edit-notes">Notes</label>
      <textarea id="edit-notes" name="notes" rows="3"></textarea>
      <div class="button-row">
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" id="edit-cancel" class="btn btn-secondary">Cancel</button>
      </div>
    </form>
  </main>
  <script src="/ui/static/app.js"></script>
</body>
</html>
{{end}}
